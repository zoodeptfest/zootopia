<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>ZOOTOPIA'26 Staff</title>
<link rel="icon" href="https://mbeat2026.github.io/loyolacollege/assets/loyola-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><img class="logo" src="https://mbeat2026.github.io/loyolacollege/assets/loyola-logo.png" alt="Loyola College logo"><div class="college">ZOOTOPIA'26 Staff</div></header>
<main class="leaf" id="lg" style="max-width:420px"><h2 class="st">Log in</h2>
 <label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password">
 <div id="le" class="msg err hide"></div><p><button id="go">Log in</button></p></main>
<section id="dash" class="wrap hide">
 <div class="row" style="align-items:center"><h2 id="dt"></h2><input id="q" placeholder="Search school, area, district, teacher"><button id="csv">Download CSV</button><button class="alt" id="out">Log out</button></div>
 <p id="stat"></p>
 <div id="cfgbox" class="hide"><fieldset><legend>Configuration (admin only)</legend>
  <div class="row"><div><label>Registration</label><select id="c_open"><option value="TRUE">Open</option><option value="FALSE">Closed</option></select></div>
  <div><label>Closing date &amp; time (IST)</label><input type="datetime-local" id="c_close"></div>
  <div><label>Max teams per school</label><input type="number" min="1" max="2" id="c_max"></div></div>
  <div class="row"><div><label>Event date</label><input id="c_date"></div><div><label>Venue</label><input id="c_venue"></div></div>
  <label>Announcement banner</label><input id="c_banner"><p><button id="savec">Save configuration</button> <span id="cm"></span></p></fieldset></div>
 <div id="tbl"></div></section>
<script>
const API='PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const $=s=>document.querySelector(s),call=async b=>(await fetch(API,{method:'POST',body:JSON.stringify(b)})).json();
let tok,role,D;
$('#lp').onkeydown=e=>e.key==='Enter'&&$('#go').click();
$('#go').onclick=async()=>{const r=await call({a:'login',user:$('#lu').value.trim(),pass:$('#lp').value});
 if(!r.ok){$('#le').textContent=r.err;$('#le').classList.remove('hide');return}
 tok=r.token;role=r.role;$('#lg').classList.add('hide');$('#dash').classList.remove('hide');
 $('#dt').textContent=role==='admin'?'Admin dashboard':'Convener dashboard';$('#cfgbox').classList.toggle('hide',role!=='admin');load()};
$('#out').onclick=()=>location.reload();
async function load(){const r=await call({a:'list',token:tok});if(!r.ok){alert(r.err);return location.reload()}
 D=r;const c=r.cfg;$('#c_open').value=c.open;$('#c_close').value=c.closeAt.slice(0,16);$('#c_max').value=c.maxTeams;$('#c_date').value=c.eventDate;$('#c_venue').value=c.venue;$('#c_banner').value=c.banner;draw()}
function draw(){const q=$('#q').value.toLowerCase(),h=D.head,si=h.indexOf('Status'),ti=h.indexOf('Teams'),ts=h.indexOf('Time');
 const rows=D.rows.filter(r=>r.join(' ').toLowerCase().includes(q));
 $('#stat').textContent=`${D.rows.length} schools · ${D.rows.reduce((a,r)=>a+Number(r[ti]||0),0)} teams · showing ${rows.length}`;
 const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
 $('#tbl').innerHTML='<table><tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+r.map((v,i)=>i===si?`<td><select data-id="${r[0]}">${['Pending','Confirmed','Checked-in','Withdrawn'].map(s=>`<option${s===v?' selected':''}>${s}</option>`).join('')}</select></td>`:`<td>${esc(i===ts?new Date(v).toLocaleString():v)}</td>`).join('')+'</tr>').join('')+'</table>';
 document.querySelectorAll('#tbl select').forEach(s=>s.onchange=async()=>{const r=await call({a:'status',token:tok,id:s.dataset.id,status:s.value});if(!r.ok)alert(r.err)})}
$('#q').oninput=draw;
$('#csv').onclick=()=>{const e=v=>'"'+String(v).replace(/"/g,'""')+'"',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[D.head,...D.rows].map(r=>r.map(e).join(',')).join('\n')],{type:'text/csv'}));a.download='zootopia26-registrations.csv';a.click()};
$('#savec').onclick=async()=>{const r=await call({a:'saveConfig',token:tok,cfg:{open:$('#c_open').value,closeAt:$('#c_close').value+':00+05:30',maxTeams:$('#c_max').value,eventDate:$('#c_date').value,venue:$('#c_venue').value,banner:$('#c_banner').value}});$('#cm').textContent=r.ok?'Saved.':r.err};
</script></body></html>
